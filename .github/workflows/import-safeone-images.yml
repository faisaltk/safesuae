name: Import permitted SafeOne product images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Download permitted product images
        run: python tools/import_safeone_images.py

      - name: Commit downloaded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/images/
          if git diff --cached --quiet; then
            echo "No new images to commit."
          else
            git commit -m "Add permitted SafeOne product images"
            git push
          fi
