<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="ZEN GROUP FZE product details.">
<title>Product Details | ZEN GROUP FZE</title>
<link rel="stylesheet" href="../style.css">
<link rel="icon" type="image/jpeg" href="../logo.jpg">
</head>
<body>
<header class="header">
  <div class="container nav-wrap">
    <a href="../index.html" class="brand"><img src="../logo.jpg" alt="ZEN GROUP FZE logo" class="logo"><span>ZEN GROUP</span></a>
    <button class="menu-toggle" aria-label="Open menu">☰</button>
    <nav class="nav">
      <a href="../index.html#home">Home</a><a href="../index.html#about">About</a><a href="../index.html#services">Services</a>
      <a href="../index.html#products">Products</a><a href="../index.html#gallery">Gallery</a><a href="../index.html#pricing">Pricing</a><a href="../index.html#contact">Contact</a>
    </nav>
    <a class="nav-whatsapp" href="https://wa.me/971559912945" target="_blank" rel="noopener">WhatsApp</a>
  </div>
</header>
<main>
<section class="detail-hero">
  <div class="container">
    <div class="breadcrumb"><a href="../index.html">Home</a> / <a href="safes/index.html">Products</a> / <span id="crumb">Product</span></div>
    <div class="detail-layout">
      <div class="product-gallery">
        <div class="gallery-main image-placeholder" id="productImageBox"><div><span>PRODUCT IMAGE</span><small id="imageCategory">PRODUCT</small></div></div>
      </div>
      <div class="detail-info">
        <span class="section-tag" id="category">PRODUCT</span>
        <h1 id="name">Product</h1>
        <p class="description" id="description"></p>
        <ul class="detail-list" id="details"></ul>
        <div class="specifications-section">
          <span class="section-tag">SPECIFICATIONS</span>
          <h2>Product Specifications</h2>
          <div class="specifications-grid" id="specifications"></div>
        </div>
        <div class="detail-actions">
          <a id="whatsapp" class="btn primary" href="https://wa.me/971559912945" target="_blank" rel="noopener">Enquire on WhatsApp</a>
          <a id="back" class="btn secondary" href="../index.html#products" style="color:var(--blue);border:1px solid var(--line);background:#fff;">← Back to Catalogue</a>
        </div>
      </div>
    </div>
  </div>
</section>
</main>
<script src="../script.js"></script>
<script>
(async function(){
  const byId=id=>document.getElementById(id);
  const key=new URLSearchParams(location.search).get('product');
  const box=byId('specifications');
  box.innerHTML='<div class="spec-row"><span>Specifications</span><strong>Loading…</strong></div>';

  async function loadProducts(){
    let lastError;
    for(let attempt=0;attempt<3;attempt++){
      try{
        const response=await fetch(new URL('products.json', window.location.href).href,{cache:'no-store'});
        if(!response.ok) throw new Error('Product data request failed: '+response.status);
        const data=await response.json();
        if(!data || !Array.isArray(data.products)) throw new Error('Product data format is invalid');
        return data.products;
      }catch(error){
        lastError=error;
        if(attempt<2) await new Promise(resolve=>setTimeout(resolve,350*(attempt+1)));
      }
    }
    throw lastError||new Error('Could not load product data');
  }

  try{
    const products=await loadProducts();
    const p=products.find(x=>x.slug===key);
    if(!p){
      byId('name').textContent='Product not found';
      box.innerHTML='<div class="spec-row"><span>Specifications</span><strong>This product could not be found. Please return to the catalogue.</strong></div>';
      return;
    }
    document.title=p.name+' | ZEN GROUP FZE';
    byId('crumb').textContent=p.name;
    byId('name').textContent=p.name;
    byId('category').textContent=p.category||'PRODUCT';
    const imageCategory=byId('imageCategory');
    if(imageCategory) imageCategory.textContent=p.category||'PRODUCT';
    byId('description').textContent=p.description||'';
    byId('details').replaceChildren(...(p.details||[]).map(value=>{
      const li=document.createElement('li'); li.textContent=value; return li;
    }));

    const labels={dimensions:'External dimensions',internal:'Internal dimensions',weight:'Weight',capacity:'Capacity',lock:'Lock type',fire:'Fire rating',storage:'Storage'};
    const specs=p.specifications||{};
    const rows=Object.keys(labels).filter(k=>specs[k]!==undefined&&specs[k]!==null&&String(specs[k]).trim()!=='');
    box.replaceChildren();
    if(rows.length){
      rows.forEach(k=>{
        const row=document.createElement('div'); row.className='spec-row';
        const label=document.createElement('span'); label.textContent=labels[k];
        const value=document.createElement('strong'); value.textContent=specs[k];
        row.append(label,value); box.appendChild(row);
      });
    }else{
      const row=document.createElement('div'); row.className='spec-row';
      const label=document.createElement('span'); label.textContent='Specifications';
      const value=document.createElement('strong'); value.textContent='Contact us for product details';
      row.append(label,value); box.appendChild(row);
    }

    const img=document.createElement('img');
    img.src=p.image||('/products/images/'+p.slug+'.webp');
    img.alt=p.name+' product image';
    img.loading='eager';
    img.decoding='async';
    img.onerror=function(){this.style.display='none';};
    const imageBox=byId('productImageBox');
    imageBox.classList.remove('image-placeholder');
    imageBox.replaceChildren(img);

    const office=['CASH COUNTING','SHREDDERS','BINDING','LAMINATION','STORAGE'].includes(p.category);
    byId('back').href=office?'office/index.html':(p.category==='STORAGE'?'storage/index.html':'safes/index.html');
  }catch(error){
    console.error('Unable to load product details:',error);
    box.innerHTML='<div class="spec-row"><span>Specifications</span><strong>Could not load product details. Please refresh in a moment or return to the catalogue.</strong></div>';
  }
})();
</script>
</body>
</html>
